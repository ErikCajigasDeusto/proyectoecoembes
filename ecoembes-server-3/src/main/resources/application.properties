spring.application.name=ecoembes-server-3
spring.output.ansi.enabled=ALWAYS
server.port=8081

# Conexion con PlasSB
plassb.base-url=http://localhost:8082

# Servidor-ContSocket (Sockets TCP)
contsocket.host=localhost
contsocket.port=8083

# Logging message pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-35.35logger{0}){cyan} : %msg%n